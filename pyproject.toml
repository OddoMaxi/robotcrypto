[project]
name = "robotcripto-momentum"
version = "0.1.0"
description = "Momentum Trading Engine V1 - Shadow-only early momentum detection bot"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["momentum*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

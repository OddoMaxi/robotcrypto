# Momentum Trading Engine V1 - configuration
# SAFETY: these two flags must stay as shown. Nothing in the codebase can place a
# real order regardless of these values (see momentum/safety) - they exist as the
# explicit, visible switch the spec requires, not as the actual safety mechanism.
mode:
  shadow_mode: true
  real_orders: 0

exchanges:
  - binance
  - bybit
  - okx

universe:
  quote_asset: USDT
  min_quote_volume_24h: 2000000        # ignore illiquid pairs
  stage_b_promote_count: 40            # top-N candidates (by Stage A fast score) per direction promoted to full engine suite
  refresh_interval_s: 300               # re-fetch exchangeInfo / 24h volume ranking
  ws_symbols_per_connection:
    binance: 60
    bybit: 40
    okx: 40
  # V1.1 mission 1: eliminate illiquid/wide-spread pairs before deep (Stage B)
  # analysis, using *live* book data - the REST min_quote_volume_24h filter above
  # only screens at discovery time and can't see live spread/depth.
  max_spread_bps_for_deep_analysis: 50
  min_depth_notional_usd: 500

# V1.1 mission 13: the VPS has 2 cores shared with the arbitrage bot. When a
# Stage A/B cycle runs long, only the weakest candidates (by |fast score|) get
# demoted to a lighter pass next cycle - strong candidates always keep the
# full engine suite; this never skips a safety check on a real contender.
compute_budget:
  degrade_threshold_ratio: 0.8          # cycle took > this fraction of cycle_interval_s -> shed load next cycle
  degraded_promote_fraction: 0.5        # keep only the top this-fraction of candidates for full Stage B while degraded

horizons_s: [5, 10, 15, 30, 60, 180, 300, 900]   # 5s .. 15m
twin_horizons_s: [5, 10, 15, 30, 60, 120, 180, 300, 600]

stage_a:
  cycle_interval_s: 2
  velocity_horizon_s: 30
  volume_horizon_s: 30
  min_abs_fast_score: 15               # below this, symbol isn't even worth Stage B this cycle

engines:
  weights:
    velocity: 0.13
    acceleration: 0.13
    volume: 0.13
    orderflow: 0.13
    orderbook_imbalance: 0.09
    breakout: 0.13
    multi_timeframe: 0.09
    volatility_expansion: 0.05
    cross_exchange: 0.12               # mission 6: master ranker v2 - initial weight, to be
                                        # revisited from Shadow data (mission 11), never hardcoded as a promise
  exhaustion:
    weight_in_confidence: -1.0          # subtracted after weighted engine sum, then clamped
    high_risk_threshold: 75
  regime:
    breadth_lookback_s: 60
  early_mover:
    confidence_threshold: 35            # momentum confidence that first fires an EARLY_MOVER_EVENT (T0)
    cooldown_s: 300                     # don't re-fire the same symbol+direction within this window

ranker:
  classification_thresholds:
    ignore: 40
    watch: 55
    building: 70
    confirmed: 82
    strong: 90
    high_conviction: 95
  exhausted_override_threshold: 75      # exhaustion_risk >= this forces EXHAUSTED regardless of confidence

entry:
  max_distance_from_trigger_pct: 0.6    # don't enter if price already ran this far past the breakout/trigger level
  min_entry_quality: 55

risk:
  paper_account_equity: 10000.0
  risk_pct_scenarios: [0.0025, 0.005, 0.01]
  default_risk_pct: 0.005
  reward_risk_target_multiple: 2.0

exits:
  breakeven_trigger_r: 0.5              # move stop to breakeven after 0.5R favorable excursion
  trailing_activation_r: 1.0
  partial_take_profit_r: 1.5
  partial_take_profit_fraction: 0.5

shadow:
  taker_fee_bps_by_exchange:            # mission 9/10: real, per-exchange taker fees, not one blanket number
    binance: 10                          # 0.10%
    bybit: 10                            # 0.10%
    okx: 8                               # 0.08% (standard OKX spot taker tier)
  maker_fee_bps: 8
  simulated_latency_ms: [50, 250]       # uniform range
  book_snapshot_history_ms: 2000
  stale_data_max_age_s: 30              # mission 14: an exchange's data older than this is treated as unavailable

dashboard:
  host: "0.0.0.0"
  port: 8801

logging:
  level: INFO
